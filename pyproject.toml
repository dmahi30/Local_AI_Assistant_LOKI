[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loki-assistant"
version = "0.1.0"
description = "LOKI: Hardware-adaptive, privacy-focused, offline-first local AI computer assistant for Windows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LOKI Project" }]
dependencies = [
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
