<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="lokiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6D1F" />
    </linearGradient>
    <linearGradient id="lokiGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F4D36" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0E1D15" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Background Aura -->
  <circle cx="50" cy="50" r="46" fill="url(#lokiGlow)" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Stylized Loki Horns & Helmet -->
  <g fill="none" stroke="url(#lokiGold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Sweeping Horn -->
    <path d="M 38 65 C 32 55, 20 45, 18 30 C 16 18, 26 12, 34 16 C 40 19, 42 26, 42 34 C 42 42, 38 52, 44 64" stroke-width="3" />

    <!-- Right Sweeping Horn -->
    <path d="M 62 65 C 68 55, 80 45, 82 30 C 84 18, 74 12, 66 16 C 60 19, 58 26, 58 34 C 58 42, 62 52, 56 64" stroke-width="3" />

    <!-- Central Crown & Crest -->
    <path d="M 44 64 L 50 48 L 56 64" stroke-width="2.5" />
    <path d="M 50 44 L 50 36" stroke-width="2.5" />
    <circle cx="50" cy="32" r="2.5" fill="url(#lokiGold)" />

    <!-- Face Guard / Helmet Mask Base -->
    <path d="M 36 65 L 50 82 L 64 65" stroke-width="2.5" fill="#102017" fill-opacity="0.7" />
    <path d="M 42 66 L 50 74 L 58 66" stroke-width="2" />
  </g>
</svg>
